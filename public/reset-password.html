<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TechnoTrade Academy — Reset Password</title>
  <meta name="description" content="Set a new password for your TechnoTrade Academy account.">
  <meta property="og:title" content="TechnoTrade Academy — Reset Password">
  <meta property="og:description" content="Securely set a new TechnoTrade Academy account password.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root{--navy:#0a1f44;--gold:#e9a13b;--bg:#f6f8fb;--ink:#101828;--muted:#5b6b82;--line:#e3e9f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}main{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(10,31,68,.08)}img{display:block;width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 14px}h1{margin:0;text-align:center;color:var(--navy);font-size:24px}p{color:var(--muted);font-size:14px;line-height:1.55}label{display:block;margin:16px 0 5px;font-size:13px;font-weight:700;color:var(--navy)}input{width:100%;min-height:48px;padding:12px;border:1px solid #cbd6e0;border-radius:12px;font:inherit;font-size:16px}button,a.button{display:block;width:100%;min-height:48px;margin-top:16px;padding:13px 16px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#fff;color:var(--navy);border:2px solid var(--navy)}#msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}#msg.error{display:block;background:#fdecec;color:#8f1d21}#msg.ok{display:block;background:#e4f7ee;color:#0b6b4a}.hide{display:none!important}
  </style>
</head>
<body>
<main>
  <img src="/technotrade-logo.png" alt="TechnoTrade Academy">
  <h1>Reset password</h1>
  <div id="recoveryPanel" class="hide">
    <p>Choose a new password for your account.</p>
    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button id="savePassword" type="submit">Save new password</button>
    </form>
  </div>
  <div id="invalidPanel">
    <p>This password-reset link is invalid, incomplete or has expired. Request a new link from the sign-in page.</p>
    <a class="button" href="/technotrade.html">Back to sign in</a>
  </div>
  <div id="msg" role="status"></div>
  <a id="doneLink" class="button secondary hide" href="/technotrade.html">Continue to sign in</a>
</main>
<script>
"use strict";
const client = window.supabase.createClient("https://kgoptzoxvcfianbrlpsz.supabase.co", "sb_publishable_7NeQIXhFI3PTnKVr7VntFQ_zq-ps6qs");
const panel = document.getElementById("recoveryPanel");
const invalid = document.getElementById("invalidPanel");
const msg = document.getElementById("msg");
function showMessage(text,kind){msg.textContent=text;msg.className=kind;}
const params = new URLSearchParams(location.hash.replace(/^#/,""));
if(params.get("type")==="recovery"){
  panel.classList.remove("hide");
  invalid.classList.add("hide");
}
document.getElementById("resetForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const password=document.getElementById("newPassword").value;
  const confirmation=document.getElementById("confirmPassword").value;
  if(password.length<6)return showMessage("Use at least 6 characters.","error");
  if(password!==confirmation)return showMessage("The passwords do not match.","error");
  const button=document.getElementById("savePassword");button.disabled=true;
  const {error}=await client.auth.updateUser({password});
  button.disabled=false;
  if(error)return showMessage(error.message,"error");
  document.getElementById("resetForm").classList.add("hide");
  document.getElementById("doneLink").classList.remove("hide");
  showMessage("Password updated. You can now sign in with your new password.","ok");
});
</script>
</body>
</html>
