<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TechnoTrade Academy — Learn Trading</title>
    <meta name="description" content="Learn trading with TechnoTrade Academy courses and membership." />
    <meta property="og:title" content="TechnoTrade Academy — Learn Trading" />
    <meta property="og:description" content="Learn trading with TechnoTrade Academy courses and membership." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
  TECHNOTRADE ACADEMY — LEARNER WEBSITE (v1.0)
  ========================================================================================
  The user-facing website for TechnoTrade Academy. Same account, same courses,
  same subscription as the Android app (Telegram-style: one login works on
  both app and web). Backend is Lovable Cloud (Supabase): tables courses /
  lessons / payment_config / subscriptions / payments / users.
  ========================================================================================
  SUPABASE CONFIG — the publishable key below is a public client identifier
  (safe to ship in browser code). NEVER paste any secret in this file: no
  Razorpay Key Secret, no webhook secret, no service-role key, no passwords.
  Payments use Razorpay Checkout (checkout.js) with the public Key ID read
  from the payment_config table (key_id) — the Key ID is public by design.
  Payment links (monthly_link / yearly_link) stay as a fallback when no
  Key ID is set. The Key Secret lives ONLY in the razorpay-webhook Edge
  Function secret — never in this file, the panel, or the repo.
  Deploy: Lovable hosting (this project). Google sign-in is managed by
  Lovable in Supabase Auth; keep this site's URL in the Supabase Site URL
  and Redirect URLs.
  ========================================================================================
-->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      :root{
        --navy:#0A1F44; --navy-2:#0E2A5C; --navy-3:#123063; --navy-dark:#06182B;
        --blue:#0B4A8F; --gold:#E9A13B; --gold-2:#F4BC5C; --gold-soft:#FBEDCF;
        --gold-dark:#8A5A00; --gold-ink:#2A1A00; --green:#0E9F6E; --green-soft:#E4F7EE;
        --red:#E5484D; --star:#F5A623; --bg:#F6F8FB; --card:#FFFFFF; --ink:#101828;
        --muted:#5B6B82; --faint:#8494AC; --line:#E3E9F2; --pill:#EDF2F9;
        --player-bg:#0A1122; --player-card:#101B36; --player-border:#1D2D55;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#DFE6F0;color:var(--ink);-webkit-font-smoothing:antialiased}
      a{color:var(--navy)}
      button{font-family:inherit}
      input,select,textarea{font-family:inherit}
      .hide{display:none!important}

      /* ---------- app shell ---------- */
      #app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 40px rgba(10,31,68,.18)}
      #view{padding-bottom:92px}
      #view.no-nav{padding-bottom:24px}

      /* ---------- appbar ---------- */
      .appbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
      .appbar .logo{width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(10,31,68,.14);font-size:19px;font-weight:800;color:var(--navy);flex:0 0 auto}
      .appbar .brand{flex:1;min-width:0}
      .appbar .brand b{display:block;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .appbar .brand span{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
      .iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.12);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
      .avatar{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);font-size:13px;font-weight:800;cursor:pointer;flex:0 0 auto}

      /* ---------- bottom nav (v1.3.2 style: solid navy, white icons, gold pill) ---------- */
      #bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--navy);border-top:2px solid var(--gold);display:flex;z-index:40;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
      #bottomnav button{flex:1;background:none;border:0;cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;min-height:52px}
      #bottomnav button .navpill{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 12px;border-radius:999px}
      #bottomnav button.active .navpill{background:var(--gold);color:var(--navy)}
      #bottomnav button svg{width:24px;height:24px;display:block}
      #bottomnav button span.lbl{font-size:11px;font-weight:700;color:#fff}
      #bottomnav button.active span.lbl{color:var(--gold-2)}

      /* ---------- generic bits ---------- */
      .wrap{padding:0 16px}
      .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
      .mut{color:var(--muted);font-size:13px;line-height:1.5}
      .err-box{background:#FDECEC;border:1px solid #F5C2C4;color:#8F1D21;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .ok-box{background:var(--green-soft);border:1px solid #BDE6D4;color:#0B6B4A;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .warn-box{background:var(--gold-soft);border:1px solid #F0D9A0;color:#6B4E00;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .btn{display:block;width:100%;font-size:15px;font-weight:800;padding:13px 16px;border:0;border-radius:12px;cursor:pointer;min-height:48px;text-align:center;text-decoration:none}
      .btn-navy{background:var(--navy);color:#fff}
      .btn-gold{background:var(--gold);color:var(--gold-ink)}
      .btn-white{background:#fff;color:var(--navy);border:2px solid var(--navy)}
      .btn:disabled{opacity:.5;cursor:default}
      .btn-sm{width:auto;display:inline-block;padding:9px 16px;min-height:40px;font-size:13px}
      label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--navy)}
      input[type=email],input[type=password],input[type=text],textarea{width:100%;font-size:16px;padding:12px;border:1px solid #CBD6E0;border-radius:12px;background:#fff;color:var(--ink)}
      textarea{min-height:90px;resize:vertical}
      .linkbtn{background:none;border:0;padding:6px 0;color:var(--navy);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
      .empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;margin:0 16px 12px}
      .empty b{display:block;font-size:15px;color:var(--navy);margin-bottom:6px}
      .empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
      .loading{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
      .backbtn{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.14);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
      .subhead{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
      .subhead h2{margin:0;font-size:18px;font-weight:800;color:var(--navy)}
      .pill{display:inline-block;background:var(--pill);color:var(--navy);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
      .pill.gold{background:var(--gold-soft);color:var(--gold-dark)}
      .pill.green{background:var(--green-soft);color:#0B6B4A}

      /* ---------- search + chips ---------- */
      .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:4px 16px 12px}
      .search span{font-size:16px;color:var(--navy)}
      .search input{border:0;padding:12px 0;outline:none}
      .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
      .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
      .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
      .sechd{display:flex;align-items:center;padding:0 16px 10px}
      .sechd b{font-size:15px;font-weight:800}
      .sechd span{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue)}

      /* ---------- course cards ---------- */
      .course{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 16px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.06)}
      .course .thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy-3));overflow:hidden}
      .course .thumb img{width:100%;height:100%;object-fit:cover;display:block}
      .course .thumb .badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:var(--navy);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.06em}
      .course .thumb .dur{position:absolute;bottom:10px;right:10px;background:rgba(5,10,24,.85);color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700}
      .course .body{padding:11px 12px 12px}
      .course .body h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.3}
      .course .body p{margin:4px 0 9px;font-size:12px;font-weight:500;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .course .meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
      .course .foot{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:9px}
      .course .foot .rating{font-size:12px;font-weight:800}
      .course .foot .rating small{color:var(--faint);font-weight:600}
      .course .foot .price{margin-left:auto;text-align:right}
      .course .foot .price b{font-size:15px;color:var(--navy)}
      .course .foot .price span{display:block;font-size:9.5px;font-weight:700;color:var(--faint)}

      /* ---------- new home: spin wheel, learning path, plans teaser ---------- */
      .wheel-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 12px;padding:16px;text-align:center}
      .wheel-card h3{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
      .wheel-card .mut{margin:6px 0 0}
      .wheel-wrap{position:relative;width:280px;max-width:76vw;height:280px;max-height:76vw;margin:14px auto}
      .wheel-spin{width:100%;height:100%;border-radius:50%;border:2px solid var(--navy)}
      .wheel-spin canvas{width:100%;height:100%;display:block;border-radius:50%}
      .wheel-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:18px solid var(--gold);z-index:2}
      .wheel-card .btn{max-width:280px;margin:0 auto}
      .spin-result{margin-top:12px}
      .spin-win{font-size:15px;font-weight:800;color:var(--navy)}
      .spin-code{display:inline-block;margin-top:6px;background:var(--gold-soft);color:var(--gold-dark);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:800;letter-spacing:.06em}
      .spin-note{margin-top:6px;font-size:12px;font-weight:600;color:var(--muted)}
      .wheel-foot{margin:12px 0 0;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.5;overflow-wrap:break-word}
      .offer-countdown{margin:10px 0 0;font-size:13px;font-weight:800;color:#B97A12}
      .cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 12px}
      .cat-card{min-width:0;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
      .cat-card.on{border-color:var(--gold);background:var(--gold-soft)}
      .cat-ic{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--gold-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
      .cat-ic svg{width:20px;height:20px;display:block}
      .cat-card b{font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.25;overflow-wrap:break-word}
      .cat-desc{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
      .path-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 12px;overflow:hidden}
      .path-step{padding:12px 14px;border-top:1px solid var(--line)}
      .path-step:first-child{border-top:0}
      .path-step b{display:block;font-size:13.5px;font-weight:800;color:var(--navy)}
      .path-step span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.5}
      .teaser{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 12px;padding:14px}
      .tp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
      .tp-row:first-child{border-top:0;padding-top:0}
      .tp-row .tx{flex:1;min-width:0}
      .tp-row .tx b{display:block;font-size:14px;font-weight:800;color:var(--navy)}
      .tp-row .tx span{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
      .tp-price{text-align:right}
      .tp-price b{font-size:18px;font-weight:800;color:var(--navy)}
      .tp-price .was{font-size:13px;font-weight:700;color:var(--faint);text-decoration:line-through;margin-left:4px}
      .tp-price .per{display:block;font-size:10px;font-weight:700;color:var(--faint)}
      .spin-applied{margin:10px 0 0;font-size:12px;font-weight:700;color:var(--gold-dark);background:var(--gold-soft);border-radius:8px;padding:8px 10px;text-align:center}
      .teaser .btn{margin-top:12px}
      .plan .top .was{font-size:13px;font-weight:700;color:var(--faint);text-decoration:line-through}
      .plan.navy .top .was{color:#AFC4E6}
      .course .meta-plain{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
      .course .foot .avail{margin-left:auto;font-size:13px;font-weight:800;color:var(--navy)}

      /* ---------- detail ---------- */
      .hero{position:relative;aspect-ratio:16/7.9;background:linear-gradient(135deg,var(--navy),var(--navy-3));overflow:hidden}
      .hero img{width:100%;height:100%;object-fit:cover;display:block}
      .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,24,.42),transparent 35%,transparent 60%,rgba(5,10,24,.45))}
      .hero .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 12px}
      .hero .fab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--gold-ink);border:0;font-size:21px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
      .hero .chip{position:absolute;right:10px;bottom:10px;background:rgba(5,10,24,.85);color:#fff;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700}
      .detail-body{padding:12px 16px 0}
      .detail-body h1{margin:8px 0 6px;font-size:19px;font-weight:800;line-height:1.3}
      .detail-body .desc{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.6;margin:0 0 10px}
      .curr-hd{display:flex;align-items:center;padding:12px 16px 8px}
      .curr-hd b{font-size:14px;font-weight:800}
      .curr-hd span{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold-dark)}
      .curr-hd span.green{color:var(--green)}
      .lessons-card{background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;margin:0 16px 12px;overflow:hidden}
      .lessons-hd{background:var(--navy);color:#fff;display:flex;align-items:center;padding:9px 12px;border-radius:10px 10px 0 0;margin:0 16px}
      .lessons-hd b{font-size:12px;font-weight:800}
      .lessons-hd span{margin-left:auto;font-size:11px;font-weight:600;color:#B9CBE8}
      .lesson-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
      .lesson-row:first-child{border-top:0}
      .lesson-row .ic{width:30px;height:30px;border-radius:50%;background:var(--pill);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
      .lesson-row.locked .ic{background:var(--gold-soft);color:var(--gold-dark)}
      .lesson-row .tx{flex:1;min-width:0}
      .lesson-row .tx b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .lesson-row .tx span{font-size:10.5px;font-weight:600;color:var(--faint)}
      .lesson-row .dl{border:0;background:none;color:var(--navy);font-size:16px;cursor:pointer;padding:6px}
      .lesson-row .dl.done{color:var(--green)}
      .cta-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;margin-top:8px}
      .cta-bar .pr b{font-size:17px;color:var(--navy)}
      .cta-bar .pr span{display:block;font-size:10px;font-weight:700;color:var(--faint)}
      .cta-bar .btn{flex:1}

      /* ---------- player ---------- */
      .player-wrap{background:var(--player-bg);color:#fff;padding:10px 16px 16px}
      .player-wrap video{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9}
      .player-wrap h1{font-size:16px;font-weight:800;margin:12px 0 4px;line-height:1.35}
      .player-wrap p{font-size:12.5px;color:#93A7C9;line-height:1.6;margin:0 0 12px}
      .player-actions{display:flex;gap:8px;flex-wrap:wrap}
      .player-actions button{flex:1;min-width:70px;background:#131F3D;border:1px solid #22345C;color:#fff;border-radius:10px;padding:10px 6px;font-size:12px;font-weight:700;cursor:pointer}
      .player-actions button.done{background:var(--green);border-color:var(--green)}
      .upnext{padding:12px 16px 0}
      .upnext h3{font-size:13px;font-weight:800;margin:0 0 8px}
      .upnext .lesson-row{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}

      /* ---------- plans ---------- */
      .plans-hd{padding:6px 16px 0}
      .plans-hd h1{font-size:19px;font-weight:800;margin:2px 0}
      .plans-hd p{font-size:12px;font-weight:600;color:var(--muted);line-height:1.55;margin:0 0 12px}
      .toggle{display:flex;background:#E7EDF6;border-radius:11px;padding:3px;margin:0 16px 12px}
      .toggle button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
      .toggle button.on{background:#fff;color:var(--navy)}
      .plan{border-radius:16px;padding:14px;margin:0 16px 12px;position:relative}
      .plan.white{background:#fff;border:1.5px solid var(--line)}
      .plan.white.sel{border-color:var(--gold);border-width:2px}
      .plan.navy{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border:1.5px solid var(--navy)}
      .plan.navy.sel{border-color:var(--gold);border-width:2px}
      .plan .top{display:flex;align-items:baseline;gap:8px}
      .plan .top b{font-size:13px;font-weight:800;letter-spacing:.04em}
      .plan.navy .top b{color:var(--gold-2)}
      .plan .top .amt{margin-left:auto;font-size:24px;font-weight:800}
      .plan .top .per{font-size:11px;font-weight:700;color:var(--faint)}
      .plan.navy .top .per{color:#AFC4E6}
      .plan .perline{font-size:11.5px;font-weight:700;color:var(--gold-2);margin:3px 0 0}
      .plan ul{list-style:none;margin:10px 0 12px;padding:0}
      .plan ul li{display:flex;gap:8px;font-size:12px;font-weight:600;line-height:1.45;margin-bottom:6px}
      .plan.white ul li{color:var(--ink)}
      .plan.navy ul li{color:#E7EEFA}
      .plan ul li .no{color:#C3CEDF}
      .plan ul li.x{color:var(--faint)}
      .badge-best{position:absolute;top:-11px;right:14px;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:4px 10px;font-size:9.5px;font-weight:800}
      .trust{display:flex;gap:6px;padding:0 16px}
      .trust div{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center;font-size:9.5px;font-weight:700;color:var(--muted);line-height:1.35}
      .trust div span{display:block;font-size:16px;margin-bottom:3px}
      .disclaimer{font-size:12px;color:var(--muted);line-height:1.6;padding:12px 16px 0}
      .verify{margin:12px 16px 0}
      .verify .row{display:flex;gap:8px}

          "Pro": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21h14M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg>'
        };
        return icons[label] || icons["Charts"];
      }
      // Real categories only (no "All") — the Home cards grid.
      function categoryCards(){ return activeChips().filter(c => c.ids); }
      function courseCategoryLabel(id){
        return {basics:"Stock Market","technical-analysis":"Charts & Indicators",options:"Derivatives",futures:"Derivatives",crypto:"Crypto","risk-management":"Risk","big-trader-strategies":"Pro Strategies"}[id] || "";
      }
      function courseLevel(id){
        return {basics:"Beginner","technical-analysis":"Intermediate",crypto:"Intermediate","risk-management":"Intermediate"}[id] || "Advanced";
      }
      function courseNeedsYearly(id){ return id === "big-trader-strategies"; }
      const PLANS = [
        {id:"monthly", name:"Monthly", pricePaise:100000, price:"₹1,000", per:"/month", durationDays:30,
         tagline:"All trading categories, 1 month",
         features:["7 courses — all except Big Trader Strategies","All course videos, full access for 1 month","Course completion certificate"],
         excluded:["Big Trader Strategies is only in Yearly"]},
        {id:"yearly", name:"Yearly", pricePaise:300000, price:"₹3,000", per:"/year", durationDays:365, perLine:"Only ₹250/month",
         tagline:"All categories + Big Trader Strategies, 1 year",
         features:["Everything in Monthly, for a full year","Big Trader Strategies — the big traders' profit playbook","New courses added through the year included","Priority doubt support"],
         excluded:[]}
      ];
      function planById(id){ return PLANS.find(p => p.id === id) || null; }
      const DISCLAIMER = "TechnoTrade Academy provides trading EDUCATION only. Nothing here is investment advice, and no returns are guaranteed. Trading involves risk — you can lose money. Please learn fully and trade only money you can afford to lose.";

      // ---------- helpers ----------
      const $ = id => document.getElementById(id);
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      function fmtRs(paise){ return "₹" + Math.round((paise || 0) / 100).toLocaleString("en-IN"); }
      function fmtDate(ts){
        try{
          const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts));
          return d.toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
        }catch(e){ return "—"; }
      }
      function fmtDateTime(ms){
        try{ return new Date(ms).toLocaleString("en-IN", {day:"numeric", month:"short", year:"numeric", hour:"numeric", minute:"2-digit"}); }
        catch(e){ return "—"; }
      }
      function fmtMmSs(sec){
        sec = Math.round(sec || 0);
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      }
      function fmtHoursShort(totalSeconds){
        if(!totalSeconds || totalSeconds <= 0) return "";
        const hours = totalSeconds / 3600;
        if(hours >= 1){
          const one = hours.toFixed(1).replace(/\.0$/, "").replace(/0$/, "");
          return one + " hrs";
        }
        return Math.floor(totalSeconds / 60) + " min";
      }
      function fmtBytes(bytes){
        if(!bytes || bytes <= 0) return "Size unknown";
        if(bytes >= 1000000) return (bytes / 1000000).toFixed(1) + " MB";
        if(bytes >= 1000) return Math.round(bytes / 1000) + " KB";
        return bytes + " B";
      }
      function driveThumb(url){ // Drive share link -> direct thumbnail URL; other URLs pass through.
        if(!url) return "";
        const m = String(url).match(/drive\.google\.com\/file\/d\/([^/]+)/);
        return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w800" : url;
      }
      function extractDriveId(url){
        if(!url) return null;
        let m = String(url).match(/\/d\/([A-Za-z0-9_-]{10,})/);
        if(m) return m[1];
        m = String(url).match(/[?&]id=([A-Za-z0-9_-]{10,})/);
        return m ? m[1] : null;
      }
      function isDriveUrl(url){ return /drive\.google\.com|drive\.usercontent\.google\.com/.test(String(url || "")); }
      // EXACTLY like the app's DriveUrls.toStreamableUrl (util/DriveUrls.kt).
      function toStreamableUrl(url){
        const t = String(url || "").trim();
        if(!t) return t;
        if(!isDriveUrl(t)) return t;
        const id = extractDriveId(t);
        return id ? "https://drive.usercontent.google.com/download?id=" + id + "&export=download&confirm=t" : t;
      }
      function initialsOf(name, email){
        const n = (name || "").trim();
        if(n){
          const parts = n.split(/\s+/);
          if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
          return n.slice(0, 2).toUpperCase();
        }
        const local = (email || "").split("@")[0];
        return local ? local.slice(0, 2).toUpperCase() : "?";
      }
      function firstNameOf(user){
        const n = (user && user.displayName || "").trim();
        return n ? n.split(/\s+/)[0] : "";
      }
      let toastTimer = null;
      function toast(msg){
        const el = $("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
      }
      // In-page modal (native dialogs do not work inside hosted/embedded views).
      let modalCb = null;
      let modalTrigger = null;
      function openModal(text, opts){
        opts = opts || {};
        modalTrigger = document.activeElement;
        $("modalText").textContent = text;
        const inp = $("modalInput");
        inp.classList.toggle("hide", !opts.input);
        inp.placeholder = opts.placeholder || "";
        inp.value = "";
        $("modalOk").textContent = opts.okLabel || "OK";
        modalCb = opts.onOk || null;
        $("modalBg").classList.remove("hide");
        if(opts.input) inp.focus(); else $("modalCancel").focus();
      }
      function closeModal(){ $("modalBg").classList.add("hide"); modalCb = null; if(modalTrigger && modalTrigger.isConnected) modalTrigger.focus(); }
      $("modalBg").addEventListener("click", e => { if(e.target === $("modalBg")) closeModal(); });
      document.addEventListener("keydown", e => {
        if($("modalBg").classList.contains("hide")) return;
        if(e.key === "Escape") closeModal();
        if(e.key === "Tab"){
          const controls = [...$("modalBg").querySelectorAll("input,button")].filter(el => !el.classList.contains("hide") && !el.disabled);
          const first = controls[0], last = controls[controls.length - 1];
          if(e.shiftKey && document.activeElement === first){e.preventDefault();last.focus();}
          else if(!e.shiftKey && document.activeElement === last){e.preventDefault();first.focus();}
        }
      });
      $("modalCancel").addEventListener("click", closeModal);
      $("modalOk").addEventListener("click", () => {
        const cb = modalCb; const val = $("modalInput").value;
        closeModal();
        if(cb) cb(val);
      });

      // ---------- local store (mirrors the app's LocalStore — on this browser only) ----------
      const LS = {
        get(key, fallback){
          try{ const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
          catch(e){ return fallback; }
        },
        set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
      };
      const store = {
        completed: () => LS.get("tt_web_completed", []),
        markCompleted(courseId, lessonId){
          const key = courseId + "|" + lessonId;
          const next = store.completed();
          if(!next.includes(key)){ next.push(key); LS.set("tt_web_completed", next); }
        },
        isCompleted(courseId, lessonId){ return store.completed().includes(courseId + "|" + lessonId); },
        downloads: () => LS.get("tt_web_downloads", []),

      // only return segment 4 (40%) or 5 (50%), 50/50.
      const WHEEL_VALUES = [5, 10, 20, 30, 40, 50];
      const WHEEL_WEIGHTS = [0, 0, 0, 0, 0.5, 0.5];
      const WHEEL_COLORS = ["#123063", "#0E2A5C", "#5B6B82", "#0A1F44", "#E9A13B", "#F4BC5C"];

      // Offer countdown: the spin offer ends 13 Nov 2026, 11:59 PM IST.

      // date here to run the offer longer.
      const OFFER_END_MS = Date.parse("2026-11-13T23:59:59+05:30");
      function offerCountdownText(){
        const left = OFFER_END_MS - Date.now();
        if(left <= 0) return "Offer ended";
        const s = Math.floor(left / 1000);
        const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
              m = Math.floor(s % 3600 / 60), sec = s % 60;

      let offerCountdownBound = false;
      function bindOfferCountdown(){

      let spinPct = 0;        // 0 = not spun yet
      let spinCode = "";

      let wheelSpinning = false;
      let spinToday = null;   // {discount, code} once the user has spun today (IST)
      let spinCheckKey = "";  // uid|IST-date already checked, so Home re-renders don't re-query
      // Asia/Kolkata is UTC+5:30 all year (no daylight saving), so IST day math is exact.
      const IST_OFFSET_MS = 5.5 * 3600 * 1000;
      function istDateStr(d){
        const ist = new Date(d.getTime() + IST_OFFSET_MS);
        return ist.getUTCFullYear() + "-" + String(ist.getUTCMonth() + 1).padStart(2, "0") + "-" + String(ist.getUTCDate()).padStart(2, "0");
      }
      function istDayRange(){
        const ist = new Date(Date.now() + IST_OFFSET_MS);
        const start = new Date(Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate()) - IST_OFFSET_MS);
        const end = new Date(start.getTime() + 86400 * 1000);
        return {start: start.toISOString(), end: end.toISOString()};
      }
      // One spin per user per calendar day (IST). Reads today's row from spin_plays;
      // a missing table or failed fetch leaves the wheel open — a spin that cannot
      // be saved is rejected at insert, so no discount is ever given for free.
      async function checkTodaySpin(){
        if(!currentUser) return;
        const key = currentUser.id + "|" + istDateStr(new Date());
        if(key === spinCheckKey) return;
        spinCheckKey = key;
        const {start, end} = istDayRange();
        const { data, error } = await supabaseClient.from("spin_plays")
          .select("discount,code,spun_at").eq("user_id", currentUser.id)
          .gte("spun_at", start).lt("spun_at", end)
          .order("spun_at", {ascending: false}).limit(1);
        if(error) return;
        const row = (data && data[0]) || null;
        if(row && typeof row.discount === "number"){
          const today = {discount: row.discount, code: row.code || ("SPIN" + row.discount)};
          if(!spinToday || spinToday.discount !== today.discount || spinToday.code !== today.code){
            spinToday = today;

            spinCode = today.code;
            render();

      async function recordSpin(value){

      async function applySpinResult(value){

          if(btn) btn.disabled = false;

          return false;

      // Pick a segment index (weighted); the value is that segment's discount.
      // Index-based so the wheel can land on ANY 40% or 50% segment, not just
      // the first one — indexOf() would always stop on the same two segments.
      function pickWheelIndex(){
        let r = Math.random(), acc = 0;
        for(let i = 0; i < WHEEL_VALUES.length; i++){
          acc += WHEEL_WEIGHTS[i];
          if(r < acc) return i;
        }
        return WHEEL_VALUES.length - 1;
      }
      function spinPricePaise(plan){
        if(!spinPct) return plan.pricePaise;
        return Math.round(plan.pricePaise * (100 - spinPct) / 100);

      function spinPerLine(p){

        }
        return p.perLine || "";

      // Resize the wheel's backing store to the displayed size x devicePixelRatio,
      // so it stays sharp on retina phones. Drawing stays in CSS-pixel coords.
      let wheelResizeBound = false;
      function bindWheelResize(){
        if(wheelResizeBound) return;
        wheelResizeBound = true;
        if(typeof window !== "undefined" && window.addEventListener){
          window.addEventListener("resize", () => { drawWheel(); });
        }
      }
      function drawWheel(){
        const cv = $("wheelCanvas");
        if(!cv) return;
        bindWheelResize();
        const dpr = (typeof window !== "undefined" && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
        let cssSize = 0;
        if(cv.getBoundingClientRect) cssSize = cv.getBoundingClientRect().width || 0;
        if(!cssSize) cssSize = cv.clientWidth || 0;
        if(!cssSize) cssSize = 280;
        const size = Math.round(cssSize);
        const backing = Math.max(1, Math.round(size * dpr));
        if(cv.width !== backing || cv.height !== backing){ cv.width = backing; cv.height = backing; }
        const ctx = cv.getContext("2d");
        if(!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cx = size / 2, cy = size / 2, R = size / 2 - 2;
        ctx.clearRect(0, 0, size, size);
        const step = (Math.PI * 2) / WHEEL_VALUES.length;
        for(let i = 0; i < WHEEL_VALUES.length; i++){
          const a0 = -Math.PI / 2 + i * step, a1 = a0 + step;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, a0, a1);
          ctx.closePath();
          ctx.fillStyle = WHEEL_COLORS[i];
          ctx.fill();
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 2;
          ctx.stroke();
          const am = a0 + step / 2;
          ctx.save();
          ctx.translate(cx + Math.cos(am) * R * 0.62, cy + Math.sin(am) * R * 0.62);
          ctx.rotate(am + Math.PI / 2);
          ctx.fillStyle = WHEEL_TEXT[i];
          ctx.font = "800 20px Manrope, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(WHEEL_VALUES[i] + "%", 0, 0);
          ctx.restore();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fillStyle = "#0A1F44";
        ctx.fill();
        ctx.strokeStyle = "#E9A13B";
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      function spinWheel(){
        if(wheelSpinning || spinToday) return;
        const idx = pickWheelIndex();
        const value = WHEEL_VALUES[idx];
        // Segment idx is centred at drawn angle (idx*60 - 60) deg; the pointer sits at the top (-90 deg).
        // Rotation (mod 360) that puts that centre under the pointer:
        const targetMod = (((-30 - idx * 60) % 360) + 360) % 360;
        const currentMod = (((wheelAngle % 360) + 360) % 360);
        let delta = targetMod - currentMod;
        if(delta < 0) delta += 360;
        const target = wheelAngle + 360 * 5 + delta;
        wheelSpinning = true;
        wheelAngle = target;
        const wrap = $("wheelSpin");
        const btn = $("spinBtn");
        if(btn) btn.disabled = true;
        const res = $("spinResult");
        if(res) res.innerHTML = "";

          wrap.style.transition = "transform 4.2s cubic-bezier(0.12, 0.8, 0.08, 1)";
          wrap.style.transform = "rotate(" + target + "deg)";
        }
        const finish = () => {
          wheelSpinning = false;
          // applySpinResult saves the spin first; a failed save shows a retry
          // message and applies no discount. The button stays disabled until
          // it resolves, so a second spin cannot start meanwhile.
          applySpinResult(value).catch(() => { if(btn) btn.disabled = false; });
        };
        if(wrap){
          let done = false;
          const onEnd = () => { if(done) return; done = true; wrap.removeEventListener("transitionend", onEnd); finish(); };
          wrap.addEventListener("transitionend", onEnd);
          setTimeout(() => { if(!done){ done = true; wrap.removeEventListener("transitionend", onEnd); finish(); } }, 4600);
        } else {

        }

      // Asks the webhook function to verify the Checkout handler signature
      // server-side (HMAC-SHA256 of order_id|payment_id with the Key Secret).
      // Non-fatal: the payments row + checkMyPayment below stay the fallback,
      // so a missing/unreachable function never blocks activation.
      async function verifyCheckoutWithServer(response){
        try{
          const res = await fetch(SUPABASE_URL + "/functions/v1/razorpay-webhook/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY},
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id || "",
              razorpay_payment_id: response.razorpay_payment_id || "",
              razorpay_signature: response.razorpay_signature || ""
            })
          });
          const out = await res.json().catch(() => ({}));
          return !!(res.ok && out && out.ok);
        }catch(e){ return false; }
      }
      async function onCheckoutSuccess(plan, amountPaise, response){
        const payId = response && response.razorpay_payment_id;
        if(!payId){
          plansNotice = "Payment finished but no Payment ID came back. Contact support (" + SUPPORT_EMAIL + ").";
          render();
          return;
        }
        const { error } = await supabaseClient.from("payments").insert({
          id: payId, user_id: (currentUser && currentUser.id) || null,
          plan_id: plan.id, amount: amountPaise, status: "captured"
        });
        if(error){
          plansNotice = "Payment received (ID " + payId + ") but could not be saved. Contact support (" + SUPPORT_EMAIL + ").";
          render();
          return;
        }
        plansNotice = "Payment received (ID " + payId + "). Activating your plan…";
        render();
        await verifyCheckoutWithServer(response);
        try{ await checkMyPayment(); }catch(e){}
        plansNotice = access().hasActiveSubscription
          ? "Payment confirmed — your " + plan.name + " plan is now active. Happy learning!"
          : "Payment received (ID " + payId + "). It will be confirmed shortly — if your plan is not active in a few minutes, contact support (" + SUPPORT_EMAIL + ").";
        render();

      function bindPlans(){
        document.querySelectorAll("[data-plan]").forEach(b => {
          b.addEventListener("click", () => { selectedPlan = b.dataset.plan; render(); });
        });
        document.querySelectorAll("[data-plancard]").forEach(card => {
          card.addEventListener("click", e => {
            if(e.target.closest("[data-buy]")) return;
            selectedPlan = card.dataset.plancard;
            render();
          });
        });
        document.querySelectorAll("[data-buy]").forEach(b => {
          b.addEventListener("click", () => {
            const planId = b.dataset.buy;
            if(paymentConfig.enabled && paymentConfig.keyId){ openCheckout(planId); return; }
            const link = planId === "yearly" ? paymentConfig.yearlyLink : paymentConfig.monthlyLink;
            if(link){ window.open(link, "_blank", "noopener"); return; }
            plansNotice = "Payments aren't set up yet — the admin needs to add the Razorpay Key ID (or a payment link) first.";
            render();
          });
        });
      }
      function verifyMsg(text, kind){
        const el = $("verifyMsg");
        if(!el) return;
        el.innerHTML = text ? '<div class="' + (kind === "err" ? "err-box" : kind === "warn" ? "warn-box" : "ok-box") + '" style="margin:0">' + esc(text) + '</div>' : "";
      }
      function subDatesFor(plan){
        const now = new Date();
        const exp = new Date(now.getTime() + plan.durationDays * 86400 * 1000);
        return {now, exp};
      }
      // Mirrors android Repo.verifyPayment + claimPayment + createSubscriptionFromPayment.
      // A subscription is created ONLY when a Supabase payments record exists with
      // status "captured" for this user and plan. There is no client-side success path.
      async function createSubscriptionFromRecord(record){
        const plan = planById(record.planId);
        if(!plan) throw new Error("Unknown plan on this payment record.");
        const {now, exp} = subDatesFor(plan);
        const { error } = await supabaseClient.from("subscriptions").insert({
          user_id: record.userId, plan_id: record.planId, status: "active",
          expires_at: exp.toISOString()
        });
        if(error) throw error;
        subscription = {planId: record.planId, status: "active", expiresAt: {toDate: () => exp}};
        render();
        store.addInbox("Subscription activated", "Your " + plan.name + " plan is active until " + fmtDate(exp) + ".");
      }
      async function checkMyPayment(){
        const btn = $("checkPaymentBtn");
        if(btn) btn.disabled = true;
        verifyMsg("", "");
        try{
          const uid = currentUser.id;
          const { data, error } = await supabaseClient.from("payments").select("*").eq("user_id", uid).order("created_at", {ascending: false});
          if(error) throw error;
          const mine = (data || []).map(normalizePayment).filter(p => p.status === "captured");
          mine.sort((a, b) => {
            const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
            const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
            return tb - ta;
          });
          if(!mine.length){
            verifyMsg("No confirmed payment found for your account yet. If you just paid, wait a minute and try again — or use your Payment ID below.", "warn");
            return;
          }
          const rec = mine[0];
          const plan = planById(rec.planId);
          if(!plan || (rec.amountPaise !== plan.pricePaise && rec.amountPaise !== spinPricePaise(plan))){
            verifyMsg("Found a payment, but its plan or amount does not match. Contact support (" + SUPPORT_EMAIL + ").", "err");
            return;
          }
          await createSubscriptionFromRecord(rec);
          verifyMsg("Payment confirmed — your " + plan.name + " plan is now active. Happy learning!", "ok");
        }catch(e){
          verifyMsg("Could not check right now: " + authErrorText(e), "err");
        }finally{
          if(btn) btn.disabled = false;
        }
      }
      async function verifyPaymentId(payId){
        const btn = $("verifyIdBtn");
        if(btn) btn.disabled = true;
        verifyMsg("", "");
        try{
          const uid = currentUser.id;
          const { data: row, error } = await supabaseClient.from("payments").select("*").eq("id", payId).maybeSingle();
          if(error) throw error;
          if(!row){
            verifyMsg("No payment found with that ID yet. Check the ID (it starts with pay_…) or wait a minute and try again.", "warn");
            return;
          }
          const rec = normalizePayment(row);
          const plan = planById(rec.planId);
          if(!plan){
            verifyMsg("This payment is not for a Monthly or Yearly plan. Contact support (" + SUPPORT_EMAIL + ").", "err");
            return;
          }
          if(rec.status !== "captured"){
            verifyMsg("This payment is not confirmed yet (status: " + (rec.status || "unknown") + "). If you just paid, wait a minute and try again.", "warn");
            return;
          }
          if(rec.amountPaise !== plan.pricePaise && rec.amountPaise !== spinPricePaise(plan)){
            verifyMsg("This payment's amount does not match the " + plan.name + " plan. Contact support (" + SUPPORT_EMAIL + ").", "err");
            return;
          }
          if(rec.userId && rec.userId !== uid){
            verifyMsg("This payment belongs to a different account. Sign in with the account you paid from.", "err");
            return;
          }
          if(!rec.userId){
            // Claim: attach this unassigned payment to the caller's own account.
            // Needs an UPDATE policy for unclaimed rows (user_id IS NULL) — see
            // the payments-claim policy in the Supabase SQL migration file.
            const { error: claimErr } = await supabaseClient.from("payments").update({user_id: uid}).eq("id", payId);
            if(claimErr) throw claimErr;
            rec.userId = uid;
          }
          await createSubscriptionFromRecord(rec);
          verifyMsg("Payment confirmed — your " + plan.name + " plan is now active. Happy learning!", "ok");
        }catch(e){
          verifyMsg("Verification failed: " + authErrorText(e), "err");
        }finally{
          if(btn) btn.disabled = false;
        }
      }

      // ---------- Profile ----------
      function renderProfile(){
        const u = currentUser;
        const a = access();
        const planLabel = a.hasActiveSubscription ? (a.planId === "yearly" ? "Yearly" : "Monthly") : "Free";
        let html = '<div class="profile-wrap">' +
          '<div class="card header">' +
          '<div class="avatar-lg">' + esc(initialsOf(u.displayName, u.email)) + '</div>' +
          '<div class="tx"><b>' + esc(u.displayName || "Learner") + '</b><span>' + esc(u.email || "") + '</span></div>' +
          (isAdmin ? '<span class="pill gold">Admin</span>' : "") +
          '</div>' +
          '<div class="sub-card"><div class="tx"><span>Subscription</span><b>' + esc(planLabel) + '</b>' +
          (a.hasActiveSubscription ? '<span>Active until ' + fmtDate(a.expiresAt) + '</span>' : '<span>Free — subscribe to unlock all courses</span>') +
          '</div><button class="btn btn-gold" onclick="plansNotice=null;go(\'plans\')">Get Premium</button></div>' +
          '<div class="list-card">';
        const rows = [
          ...(isAdmin ? [{icon:"🛠️", t:"Admin Panel", s:"Manage courses, lessons and payments", route:"admin"}] : []),
          {icon:"📈", t:"My progress", s:"Completed lessons by course", route:"progress"},
          {icon:"⬇️", t:"Downloads", s:"Offline lesson videos", route:"downloads"},
          {icon:"🧾", t:"Payment history", s:"Your Razorpay payments", route:"payments"},
          {icon:"🔔", t:"Notifications", s:"Subscription updates", route:"notifications"},
          {icon:"❓", t:"Help & Support", s:"Email " + SUPPORT_EMAIL, route:"help"},
          {icon:"⚙️", t:"Settings", s:"Notifications, video quality, version", route:"settings"}
        ];
        rows.forEach(r => {
          html += '<button type="button" class="rowitem" data-profile="' + r.route + '"><span class="ic">' + r.icon + '</span><span class="tx"><b>' + r.t + '</b><span>' + esc(r.s) + '</span></span><span class="chev">›</span></button>';
        });
        html += '</div>' +
          '<button class="btn btn-white signout" id="signOutBtn">Sign out</button>' +
          '<p class="mut" style="text-align:center;font-size:12px;margin:14px 0 20px">TechnoTrade Academy · Website v' + WEB_VERSION + ' · ' + esc(SUPPORT_EMAIL) + '</p>' +
          '</div>';
        return html;
      }
      function bindProfile(){
        document.querySelectorAll("[data-profile]").forEach(el => {
          el.addEventListener("click", () => {
            if(el.dataset.profile === "help"){
              window.location.href = "mailto:" + SUPPORT_EMAIL + "?subject=TechnoTrade%20Academy%20—%20Help";
            } else if(el.dataset.profile === "admin"){
              window.location.href = "/admin.html";
            } else {
              go(el.dataset.profile);
            }
          });
        });
        const so = $("signOutBtn");
        if(so) so.addEventListener("click", async () => { await signOut(); });
      }
      function subHead(title, backRoute){
        return '<div class="subhead"><button class="backbtn" onclick="go(\'' + backRoute + '\')">←</button><h2>' + esc(title) + '</h2></div>';
      }
      function renderProgress(){
        const completed = store.completed();
        const totalLessons = courses.reduce((n, c) => n + ((lessonStats[c.id] || {}).count || 0), 0);
        const doneCount = completed.length;
        const overallPct = totalLessons > 0 ? Math.round((doneCount / totalLessons) * 100) : 0;
        let html = subHead("My progress", "profile");
        html += '<div class="card"><div class="prow"><b>Overall progress</b><b>' + overallPct + '%</b></div>' +
          '<div class="bar"><i style="width:' + overallPct + '%"></i></div>' +
          '<p class="mut">' + doneCount + ' of ' + totalLessons + ' lessons completed</p></div>';
        if(!courses.length){
          html += '<div class="empty"><b>No courses yet</b><p>Courses will appear here once added.</p></div>';
        } else {
          courses.forEach(c => {
            const stats = lessonStats[c.id] || {count:0, totalDurationSec:0};
            if(stats.count === 0) return;
            const done = completed.filter(k => k.startsWith(c.id + "|")).length;
            const pct = Math.round((done / stats.count) * 100);
            html += '<div class="card"><div class="prow"><b>' + esc(c.title) + '</b><b>' + done + '/' + stats.count + '</b></div>' +
              '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
              '<p class="mut">' + pct + '% complete</p></div>';
          });
        }
        return html;
      }
      function renderDownloads(){
        const list = store.downloads();
        let html = subHead("Downloads", "profile");
        if(!list.length){
          html += '<div class="empty"><b>No downloads yet</b><p>Tap the download button on a lesson to save it for offline viewing. Progress is saved on this device only.</p></div>';
        } else {
          html += '<div class="lessons-card">' + list.map(d =>
            '<div class="lesson-row"><div class="ic">⬇</div><div class="tx"><b>' + esc(d.lessonTitle) + '</b><span>' +
            esc(d.courseTitle) + ' · ' + esc(d.fileName) + ' · ' + fmtDateTime(d.downloadedAt) + '</span></div>' +
            '<button class="dl" data-dl-play="' + esc(d.courseId) + '/' + esc(d.lessonId) + '" title="Play">▶</button>' +
            '<button class="dl" data-dl-del="' + esc(d.courseId) + '/' + esc(d.lessonId) + '" title="Delete">✕</button>' +
            '</div>').join("") + '</div>';
        }
        return html;
      }
      function bindDownloads(){
        document.querySelectorAll("[data-dl-play]").forEach(b => {
          b.addEventListener("click", () => {
            const parts = b.dataset.dlPlay.split("/");
            go("lesson/" + parts[0] + "/" + parts[1]);
          });
        });
        document.querySelectorAll("[data-dl-del]").forEach(b => {
          b.addEventListener("click", () => {
            const parts = b.dataset.dlDel.split("/");
            openModal("Delete this download entry? (The video file itself stays in your browser Downloads folder.)", {
              okLabel: "Delete",
              onOk: () => { store.removeDownload(parts[0], parts[1]); render(); toast("Download removed."); }
            });
          });
        });
      }
      let paymentHistory = null;
      let paymentHistoryLoading = false;
      function renderPaymentHistory(){
        let html = subHead("Payment history", "profile");
        if(!paymentHistory){
          html += '<div class="loading">Loading payments…</div>';
        } else if(!paymentHistory.length){
          html += '<div class="empty"><b>No payments yet</b><p>Payments you make through Razorpay will appear here.</p></div>';
        } else {
          html += paymentHistory.map(p => {
            const plan = planById(p.planId);
            return '<div class="card"><div class="prow"><b>' + esc(plan ? plan.name + " plan" : "Payment") + '</b><b>' + fmtRs(p.amountPaise) + '</b></div>' +
              '<p class="mut" style="margin:4px 0 0">Status: ' + esc(p.status || "") + '<br>' +
              (p.razorpayPaymentId ? "Payment ID: " + esc(p.razorpayPaymentId) + "<br>" : "") +
              (p.createdAt && p.createdAt.seconds ? fmtDateTime(p.createdAt.seconds * 1000) : "") + '</p></div>';
          }).join("");
        }
        return html;
      }
      function bindPaymentHistory(){
        if(paymentHistoryLoading || paymentHistory !== null) return;
        paymentHistoryLoading = true;
        supabaseClient.from("payments").select("*").eq("user_id", currentUser.id).order("created_at", {ascending: false})
          .then(({data, error}) => {
            if(error) throw error;
            const list = (data || []).map(normalizePayment);
            list.sort((a, b) => {
              const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
              const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
              return tb - ta;
            });
            paymentHistory = list;
            const r = currentRoute();
            if(r.name === "payments") render();
          })
          .catch(() => {
            paymentHistory = [];
            const r = currentRoute();
            if(r.name === "payments") render();
          }).finally(() => { paymentHistoryLoading = false; });
      }
      function renderNotifications(){
        const list = store.inbox();
        let html = subHead("Notifications", "profile");
        if(!list.length){
          html += '<div class="empty"><b>No notifications yet</b><p>Subscription updates and other alerts will appear here.</p></div>';
        } else {
          html += list.map(n => '<div class="card"><div class="prow"><b>' + esc(n.title) + '</b></div><p class="mut">' + esc(n.body) + '</p><p class="mut">' + fmtDateTime(n.timeMs) + '</p></div>').join("");
        }
        return html;
      }
      function renderSettings(){
        const s = store.settings();
        let html = subHead("Settings", "profile");
        html += '<div class="card"><div class="prow"><b>Notifications</b>' +
          '<button class="switch ' + (s.notificationsEnabled ? "on" : "") + '" id="notifToggle" aria-label="Notifications"><i></i></button></div>' +
          '<p class="mut">Get subscription and course updates on this device.</p></div>';
        html += '<div class="card"><div class="prow"><b>Video quality</b></div>' +
          '<div class="chips">' +
            ["auto","high","medium"].map(q =>
              '<button class="chip' + (s.videoQuality === q ? " on" : "") + '" data-quality="' + q + '">' + q.toUpperCase() + '</button>').join("") +
          '</div><p class="mut">Applies to lesson playback on this device.</p></div>';
        html += '<div class="card"><div class="prow"><b>Website version</b><b>v' + WEB_VERSION + '</b></div>' +
          '<p class="mut">TechnoTrade Academy · Website ' + WEB_VERSION + ' · Android app v1.3.2</p>' +
          '<p class="mut">Support: <a href="mailto:' + SUPPORT_EMAIL + '">' + SUPPORT_EMAIL + '</a></p></div>';
        return html;
      }
      function bindSettings(){
        const t = $("notifToggle");
        if(t) t.addEventListener("click", () => {
          const s = store.setSettings({notificationsEnabled: !store.settings().notificationsEnabled});
          t.classList.toggle("on", s.notificationsEnabled);
          toast(s.notificationsEnabled ? "Notifications on." : "Notifications off.");
        });
        document.querySelectorAll("[data-quality]").forEach(b => {
          b.addEventListener("click", () => {
            store.setSettings({videoQuality: b.dataset.quality});
            render();
          });
        });
      }

      // Fresh sign-in always lands on Home: a tab other than Home left in the
      // URL (e.g. #/courses from the signed-out screen) is not kept. Deep links
      // to a course or lesson are preserved, as are returning sessions.
      function landOnHomeAfterSignIn(event){
        if(event !== "SIGNED_IN" || !currentUser) return;
        const r = currentRoute();
        if(isTabRoute(r.name) && r.name !== "home") location.hash = "#/home";
      }

      // ---------- boot ----------
      // Normalize the Supabase user into the shape the UI expects
      // ({uid, id, email, displayName}) so the rest of the code is unchanged.
      function normalizeUser(user){
        const meta = user.user_metadata || {};
        const displayName = meta.display_name || meta.full_name || meta.name || "";
        return {uid: user.id, id: user.id, email: user.email || "", displayName: displayName};
      }
      let lastAuthUid = undefined;
      supabaseClient.auth.onAuthStateChange((event, session) => {
        const user = session ? session.user : null;
        const uid = user ? user.id : null;
        if(event === "TOKEN_REFRESHED" && uid === lastAuthUid) return; // silent refresh: nothing to redo
        lastAuthUid = uid;
        currentUser = user ? normalizeUser(user) : null;
        isAdmin = false;
        if(currentUser){
          ensureUserDoc().catch(() => {});
          loadAdminAccess().catch(() => {});
        }
        landOnHomeAfterSignIn(event);
        startListeners();
        render();
      });
      window.addEventListener("hashchange", () => { paymentHistory = null; render(); window.scrollTo(0,0); });
    </script>
  </body>
</html>
