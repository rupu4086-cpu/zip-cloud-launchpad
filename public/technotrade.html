<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TechnoTrade Academy — Learn Trading</title>
    <meta name="description" content="Learn trading with TechnoTrade Academy courses and membership." />
    <meta property="og:title" content="TechnoTrade Academy — Learn Trading" />
    <meta property="og:description" content="Learn trading with TechnoTrade Academy courses and membership." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
  TECHNOTRADE ACADEMY — LEARNER WEBSITE (v1.0)
  ========================================================================================
  The user-facing website for TechnoTrade Academy. Same account, same courses,
  same subscription as the Android app (Telegram-style: one login works on
  both app and web). Backend is Lovable Cloud (Supabase): tables courses /
  lessons / payment_config / subscriptions / payments / users.
  ========================================================================================
  SUPABASE CONFIG — the publishable key below is a public client identifier
  (safe to ship in browser code). NEVER paste any secret in this file: no
  Razorpay Key Secret, no webhook secret, no service-role key, no passwords.
  Payments use Razorpay Checkout (checkout.js) with the public Key ID read
  from the payment_config table (key_id) — the Key ID is public by design.
  Payment links (monthly_link / yearly_link) stay as a fallback when no
  Key ID is set. The Key Secret lives ONLY in the razorpay-webhook Edge
  Function secret — never in this file, the panel, or the repo.
  Deploy: Lovable hosting (this project). Google sign-in is managed by
  Lovable in Supabase Auth; keep this site's URL in the Supabase Site URL
  and Redirect URLs.
  ========================================================================================
-->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      :root{
        --navy:#0A1F44; --navy-2:#0E2A5C; --navy-3:#123063; --navy-dark:#06182B;
        /* Design tokens (replica/design/tokens.css) — use var(--tt-*) in new components. */
        --tt-bg:#F6F8FB; --tt-surface:#FFFFFF; --tt-surface-2:#EDF2F9; --tt-border:#E3E9F2;
        --tt-border-input:#5B6B82; --tt-text:#0A1F44; --tt-text-muted:#5B6B82;
        --tt-accent:#0B4A8F; --tt-accent-hover:#0A3A73; --tt-on-accent:#FFFFFF;
        --tt-navy:#0A1F44; --tt-on-navy:#FFFFFF; --tt-gold:#E9A13B; --tt-on-gold:#0A1F44;
        --tt-on-gold-muted:#22345C; --tt-gold-deep:#B97A12; --tt-danger:#C92A2A;
        --tt-danger-bg:#FDECEC; --tt-success:#0B6B4A; --tt-success-bg:#E4F7EE;
        --tt-warning:#8A5A00; --tt-warning-bg:#FBEDCF; --tt-scrim:rgba(10, 31, 68, 0.55);
        --tt-gradient-cta:linear-gradient(135deg, #0B4A8F 0%, #0A1F44 100%);
        --tt-gradient-gold:linear-gradient(135deg, #F4BC5C 0%, #E9A13B 100%);
        --tt-gradient-hero:linear-gradient(160deg, #0A1F44 0%, #123063 55%, #0B4A8F 100%);
        --tt-radius-sm:8px; --tt-radius-md:12px; --tt-radius-lg:16px; --tt-radius-xl:20px; --tt-radius-pill:999px;
        --tt-shadow-card:0 1px 2px rgba(10, 31, 68, 0.06), 0 1px 3px rgba(10, 31, 68, 0.10);
        --tt-shadow-pop:0 12px 32px rgba(10, 31, 68, 0.16);
        --tt-shadow-sheet:0 -8px 32px rgba(10, 31, 68, 0.24);
        --tt-motion-fast:120ms; --tt-motion-base:200ms; --tt-motion-slow:320ms; --tt-motion-ease:cubic-bezier(.2,.8,.2,1);
        --tt-shell-max:560px; --tt-content-pad-x:16px; --tt-header-height:56px; --tt-bottom-nav-height:64px; --tt-touch-min:44px;
        --tt-text-xs:12px; --tt-text-sm:14px; --tt-text-base:16px; --tt-text-lg:20px; --tt-text-xl:24px; --tt-text-display:32px;
        --blue:#0B4A8F; --gold:#E9A13B; --gold-2:#F4BC5C; --gold-soft:#FBEDCF;
        --gold-dark:#8A5A00; --gold-ink:#2A1A00; --green:#0E9F6E; --green-soft:#E4F7EE;
        --red:#E5484D; --star:#F5A623; --bg:#F6F8FB; --card:#FFFFFF; --ink:#101828;
        --muted:#5B6B82; --faint:#8494AC; --line:#E3E9F2; --pill:#EDF2F9;
        --player-bg:#0A1122; --player-card:#101B36; --player-border:#1D2D55;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#DFE6F0;color:var(--ink);-webkit-font-smoothing:antialiased}
      a{color:var(--navy)}
      button{font-family:inherit}
      input,select,textarea{font-family:inherit}
      .hide{display:none!important}

      /* ---------- app shell ---------- */
      #app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 40px rgba(10,31,68,.18)}
      #view{padding-bottom:92px}
      #view.no-nav{padding-bottom:24px}

      /* ---------- appbar ---------- */
      .appbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
      .appbar .logo{width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(10,31,68,.14);font-size:19px;font-weight:800;color:var(--navy);flex:0 0 auto}
      .appbar .brand{flex:1;min-width:0}
      .appbar .brand b{display:block;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .appbar .brand span{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
      .iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.12);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
      .avatar{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);font-size:13px;font-weight:800;cursor:pointer;flex:0 0 auto}

      /* ---------- bottom nav (v1.3.2 style: solid navy, white icons, gold pill) ---------- */
      #bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--navy);border-top:2px solid var(--gold);display:flex;z-index:40;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
      #bottomnav button{flex:1;background:none;border:0;cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;min-height:52px}
      #bottomnav button .navpill{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 12px;border-radius:999px}
      #bottomnav button.active .navpill{background:var(--gold);color:var(--navy)}
      #bottomnav button svg{width:24px;height:24px;display:block}
      #bottomnav button span.lbl{font-size:11px;font-weight:700;color:#fff}
      #bottomnav button.active span.lbl{color:var(--gold-2)}

      /* ---------- generic bits ---------- */
      .wrap{padding:0 16px}
      .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
      .mut{color:var(--muted);font-size:13px;line-height:1.5}
      .err-box{background:#FDECEC;border:1px solid #F5C2C4;color:#8F1D21;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .ok-box{background:var(--green-soft);border:1px solid #BDE6D4;color:#0B6B4A;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .warn-box{background:var(--gold-soft);border:1px solid #F0D9A0;color:#6B4E00;border-radius:12px;padding:12px;font-size:13px;font-weight:600;line-height:1.5;margin:0 16px 12px}
      .btn{display:block;width:100%;font-size:15px;font-weight:800;padding:13px 16px;border:0;border-radius:12px;cursor:pointer;min-height:48px;text-align:center;text-decoration:none}
      .btn-navy{background:var(--navy);color:#fff}
      .btn-gold{background:var(--gold);color:var(--gold-ink)}
      .btn-white{background:#fff;color:var(--navy);border:2px solid var(--navy)}
      .btn:disabled{opacity:.5;cursor:default}
      .btn-sm{width:auto;display:inline-block;padding:9px 16px;min-height:40px;font-size:13px}
      label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--navy)}
      input[type=email],input[type=password],input[type=text],textarea{width:100%;font-size:16px;padding:12px;border:1px solid #CBD6E0;border-radius:12px;background:#fff;color:var(--ink)}
      textarea{min-height:90px;resize:vertical}
      .linkbtn{background:none;border:0;padding:6px 0;color:var(--navy);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
      .empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;margin:0 16px 12px}
      .empty b{display:block;font-size:15px;color:var(--navy);margin-bottom:6px}
      .empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
      .loading{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
      .backbtn{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.14);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
      .subhead{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
      .subhead h2{margin:0;font-size:18px;font-weight:800;color:var(--navy)}
      .pill{display:inline-block;background:var(--pill);color:var(--navy);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
      .pill.gold{background:var(--gold-soft);color:var(--gold-dark)}
      .pill.green{background:var(--green-soft);color:#0B6B4A}

      /* ---------- search + chips ---------- */
      .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:4px 16px 12px}
      .search span{font-size:16px;color:var(--navy)}
      .search input{border:0;padding:12px 0;outline:none}
      .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
      .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
      .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
      .sechd{display:flex;align-items:center;padding:0 16px 10px}
      .sechd b{font-size:15px;font-weight:800}
      .sechd span{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue)}

      /* ---------- course cards ---------- */
      .course{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 16px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(10,31,68,.06)}
      .course .thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy-3));overflow:hidden}
      .course .thumb img{width:100%;height:100%;object-fit:cover;display:block}
      .course .thumb .badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:var(--navy);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.06em}
      .course .thumb .dur{position:absolute;bottom:10px;right:10px;background:rgba(5,10,24,.85);color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700}
      .course .body{padding:11px 12px 12px}
      .course .body h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.3}
      .course .body p{margin:4px 0 9px;font-size:12px;font-weight:500;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .course .meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
      .course .foot{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:9px}
      .course .foot .price{margin-left:auto;text-align:right}
      .course .foot .price b{font-size:15px;color:var(--navy)}
      .course .foot .price span{display:block;font-size:9.5px;font-weight:700;color:var(--faint)}

      .cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 12px}
      .cat-card{min-width:0;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
      .cat-card.on{border-color:var(--gold);background:var(--gold-soft)}
      .cat-ic{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--gold-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
      .cat-ic svg{width:20px;height:20px;display:block}
      .cat-card b{font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.25;overflow-wrap:break-word}
      .cat-desc{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
      .path-step:first-child{border-top:0}
      .path-step b{display:block;font-size:13.5px;font-weight:800;color:var(--navy)}
      .path-step span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.5}
      .tp-row:first-child{border-top:0;padding-top:0}
      .plan .top .was{font-size:13px;font-weight:700;color:var(--faint);text-decoration:line-through}
      .plan.navy .top .was{color:#AFC4E6}
      .course .meta-plain{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
      .course .foot .avail{margin-left:auto;font-size:13px;font-weight:800;color:var(--navy)}


      /* ---------- redesign: trial hero, paywall sheet, rails, subscription card ---------- */
      .trial-hero{background:var(--tt-gradient-hero);border-radius:var(--tt-radius-lg);margin:0 16px 12px;padding:20px;color:var(--tt-on-navy);box-shadow:var(--tt-shadow-card)}
      .trial-hero .trial-eyebrow{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--tt-gold)}
      .trial-hero h2{margin:0 0 8px;font-size:24px;font-weight:800;line-height:1.25;color:var(--tt-on-navy)}
      .trial-hero .trial-sub{margin:0 0 14px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.92)}
      .trial-hero .btn{max-width:280px}
      .trial-hero .trial-fine{margin:10px 0 0;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
      .trial-progress{height:8px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin:0 0 14px}
      .trial-progress i{display:block;height:100%;background:var(--tt-gold);border-radius:999px}
      .trial-banner{background:var(--tt-warning-bg);border:1px solid #F0D9A0;color:var(--tt-warning);border-radius:var(--tt-radius-md);padding:12px;margin:0 16px 12px;font-size:13px;font-weight:700;line-height:1.5}
      .sheet-scrim{position:fixed;inset:0;background:var(--tt-scrim);z-index:80}
      .paywall-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--tt-surface);border-radius:var(--tt-radius-xl) var(--tt-radius-xl) 0 0;box-shadow:var(--tt-shadow-sheet);z-index:81;padding:8px 20px calc(20px + env(safe-area-inset-bottom))}
      .sheet-handle{width:40px;height:4px;border-radius:999px;background:var(--tt-border);margin:4px auto 12px}
      .sheet-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--tt-surface-2);color:var(--tt-text);font-size:16px;cursor:pointer}
      .paywall-sheet h2{margin:6px 0 12px;font-size:24px;font-weight:800;color:var(--tt-text);padding-right:48px}
      .paywall-benefits{list-style:none;margin:0 0 14px;padding:0}
      .paywall-benefits li{display:flex;gap:10px;font-size:14px;font-weight:600;line-height:1.5;margin-bottom:8px;color:var(--tt-text)}
      .paywall-benefits li span:first-child{color:var(--tt-success);font-weight:800}
      .paywall-price{margin:0;font-size:20px;font-weight:800;color:var(--tt-text)}
      .paywall-charge{margin:8px 0;font-size:16px;font-weight:700;line-height:1.5;color:var(--tt-text)}
      .paywall-charge-date{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--tt-accent)}
      .paywall-methods{margin:0 0 14px}
      .method-row{display:flex;align-items:flex-start;gap:10px;min-height:48px;border:1.5px solid var(--tt-border);border-radius:var(--tt-radius-md);padding:10px 12px;margin-bottom:8px;cursor:pointer}
      .method-row:has(input:checked){border-color:var(--tt-accent);border-width:2px}
      .method-row input{width:18px;height:18px;accent-color:var(--tt-accent);margin-top:2px;flex:0 0 auto}
      .method-row .method-tx{display:flex;flex-direction:column;gap:2px}
      .method-row .method-tx b{font-size:14px;font-weight:800;color:var(--tt-text)}
      .method-row .method-tx span{font-size:12px;font-weight:500;color:var(--tt-text-muted);line-height:1.45}
      .paywall-cta{margin-bottom:10px}
      .paywall-fine{margin:0;font-size:12px;line-height:1.55;color:var(--tt-text-muted)}
      body.sheet-open{overflow:hidden}
      .rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
      .rail .course{flex:0 0 240px;scroll-snap-align:start;margin:0}
      .rail .course .body h3{font-size:13.5px}
      .course .trial-badge{position:absolute;top:10px;right:10px;background:var(--tt-gold);color:var(--tt-on-gold);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:800;letter-spacing:.04em}
      .course .prog{height:4px;background:var(--tt-surface-2);border-radius:999px;overflow:hidden;margin-top:9px}
      .course .prog i{display:block;height:100%;background:var(--tt-accent);border-radius:999px}
      .course .foot .meta-line{font-size:12px;font-weight:700;color:var(--tt-text-muted)}
      .sub-status-card{background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:var(--tt-radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--tt-shadow-card)}
      .sub-status-card .status-pill{float:right;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
      .status-pill.trial{background:var(--tt-gold);color:var(--tt-on-gold)}
      .status-pill.active{background:var(--tt-success-bg);color:var(--tt-success)}
      .status-pill.ended{background:var(--tt-surface-2);color:var(--tt-text-muted)}
      .sub-status-card b.plan-name{display:block;font-size:16px;font-weight:800;color:var(--tt-text)}
      .sub-status-card p{margin:6px 0;font-size:13px;line-height:1.55;color:var(--tt-text-muted)}
      .sub-status-card p.charge-line{color:var(--tt-accent);font-weight:700}
      .sub-status-card .no-renew{font-size:13px;font-weight:700;color:var(--tt-text-muted)}
      .faq-item{background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:var(--tt-radius-md);margin:0 16px 8px;overflow:hidden}
      .faq-item summary{padding:13px 14px;font-size:14px;font-weight:800;color:var(--tt-text);cursor:pointer;list-style:none}
      .faq-item summary::-webkit-details-marker{display:none}
      .faq-item p{margin:0;padding:0 14px 13px;font-size:13px;line-height:1.6;color:var(--tt-text-muted)}
      .search-trends{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
      .hist-row{display:flex;align-items:center;gap:8px;padding:0 16px 8px}
      .hist-row button{flex:1;text-align:left;background:none;border:0;font-size:13px;font-weight:600;color:var(--tt-text);cursor:pointer;padding:8px 0}
      .hist-row .hist-del{border:0;background:none;color:var(--tt-text-muted);font-size:16px;cursor:pointer;padding:8px;min-width:44px;min-height:44px}
      .autoplay-card{background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:var(--tt-radius-md);padding:14px;margin:12px 16px 0;text-align:center}
      .autoplay-card b{display:block;font-size:14px;font-weight:800;color:var(--tt-text);margin-bottom:4px}
      .autoplay-card p{margin:0 0 10px;font-size:13px;color:var(--tt-text-muted)}
      .player-actions button.on{background:var(--tt-accent);border-color:var(--tt-accent)}
      .speed-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
      .speed-row button{background:#131F3D;border:1px solid #22345C;color:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;min-height:44px}
      .speed-row button.on{background:var(--tt-gold);border-color:var(--tt-gold);color:var(--tt-on-gold)}
      .quota-line{margin:10px 0 0;font-size:12px;font-weight:700;color:#93A7C9}
      .lib-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 16px 8px;padding:10px 12px;cursor:pointer}
      .lib-row .tx{flex:1;min-width:0}

      /* ---------- detail ---------- */

      .lesson-row .tx b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .lesson-row .tx span{font-size:10.5px;font-weight:600;color:var(--faint)}

      /* ---------- player ---------- */
      .player-wrap{background:var(--player-bg);color:#fff;padding:10px 16px 16px}

      /* ---------- profile ---------- */
      .profile-head{background:linear-gradient(135deg,var(--navy),var(--navy-3));padding:16px;border-radius:0 0 20px 20px;margin-bottom:-8px;position:relative;overflow:hidden}

      .member .tx b{display:block;font-size:13px;font-weight:800}
      .member .tx span{font-size:11px;font-weight:600;color:var(--muted);line-height:1.4}
      .menu{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 16px 12px;overflow:hidden}
      .menu button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 13px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
      .menu button:first-child{border-top:0}
      .menu button .mi{width:30px;height:30px;border-radius:9px;background:var(--pill);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}

      .menu button.danger .mi{background:#FDECEC;color:var(--red)}
      .menu button .chev{margin-left:auto;color:var(--faint);font-size:15px}

      /* progress bars */
      .prog-navy{background:var(--navy);border-radius:14px;padding:16px;margin:8px 16px 12px;color:#fff}
      .prog-navy small{font-size:12px;font-weight:700;color:#B9CBE8}
      .prog-navy .big{font-size:30px;font-weight:800}
      .prog-navy .sub{font-size:12px;font-weight:600;color:#B9CBE8}
      .bar{height:8px;border-radius:99px;background:#22345C;overflow:hidden;margin-top:10px}
      .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
      .bar.light{background:#EDF2F9}
      .prog-row{margin:0 16px 10px}
      .prog-row .tx{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}

      /* settings rows */
      .set-row{display:flex;align-items:center;gap:10px;padding:4px 0}
      .set-row .tx{flex:1}
      .set-row .tx b{display:block;font-size:13.5px;font-weight:800}
      .set-row .tx span{font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.45}
      .switch{width:48px;height:28px;border-radius:99px;border:0;background:#CBD6E0;cursor:pointer;position:relative;flex:0 0 auto;padding:0}
      .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
      .switch.on{background:var(--gold)}
      .switch.on::after{left:23px}
      .radio-row{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer}
      .radio-row input{width:18px;height:18px;accent-color:var(--navy)}
      .radio-row b{font-size:12.5px;font-weight:700}
      .radio-row span{font-size:11px;font-weight:500;color:var(--muted)}

      /* ---------- auth ---------- */
      .auth{padding:24px 16px 0}
      .auth .logo-big{width:72px;height:72px;border-radius:18px;background:#fff;box-shadow:0 4px 16px rgba(10,31,68,.16);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--navy);margin:8px auto 14px}
      .auth h1{text-align:center;font-size:22px;font-weight:800;margin:0 0 4px;color:var(--navy)}
      .auth .sub{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 18px}
      .divider{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:var(--muted);font-size:13px;font-weight:600}
      .divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
      .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;max-width:520px;width:calc(100% - 32px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}

      .modal .actions button{flex:1}
      @media (min-width:600px){ .course .thumb{aspect-ratio:16/8} }

      /* Mobile layout repairs, using the uploaded site's existing theme. */

      .prow b{min-width:0;overflow-wrap:anywhere}

      .cta-bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}

      .modal-bg{overflow-y:auto;overscroll-behavior:contain}

      .modal p{overflow-wrap:anywhere}
      .modal .actions{margin-top:12px}

      @media(max-width:360px){
        .appbar{padding-left:12px;padding-right:12px;gap:6px}
        .appbar .brand b{white-space:normal;line-height:1.3;font-size:13px}
        .sub-card{grid-template-columns:minmax(0,1fr)}
        .sub-card .btn{width:100%}
        .plan .top .amt{font-size:22px}
        .cta-bar{grid-template-columns:minmax(0,1fr)}
      }
      @media(prefers-reduced-motion:reduce){.switch::after{transition:none}}
      /* ---------- support chat (WhatsApp-style) ---------- */
      .chat-thread{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;padding:4px 16px 8px}

      .chat-input{display:flex;gap:8px;padding:0 16px 12px}
      .chat-input input{flex:1}
      .chat-input .btn{width:auto}
    </style>

      const TRIAL_FEE_PAISE = 100;          // Rs.1 upfront addon

      const TRIAL_DURATION_MS = 24 * 3600 * 1000; // exactly 24 hours
      let trialStatus = null;   // {id, status, trialEndsAtMs, chargeAtMs, chargePaymentId} | null
      let trialLoaded = false;

      // Asia/Kolkata is UTC+5:30 all year (no daylight saving), so IST day math is exact.
      const IST_OFFSET_MS = 5.5 * 3600 * 1000;
      function istDateStr(d){
        const ist = new Date(d.getTime() + IST_OFFSET_MS);
        return ist.getUTCFullYear() + "-" + String(ist.getUTCMonth() + 1).padStart(2, "0") + "-" + String(ist.getUTCDate()).padStart(2, "0");
      }
      function istDayRange(){
        const ist = new Date(Date.now() + IST_OFFSET_MS);
        const start = new Date(Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate()) - IST_OFFSET_MS);
        const end = new Date(start.getTime() + 86400 * 1000);
        return {start: start.toISOString(), end: end.toISOString()};

          if(error) throw error;

            trialEndsAtMs: data.trial_ends_at ? Date.parse(data.trial_ends_at) : null,
            chargeAtMs: data.charge_at ? Date.parse(data.charge_at) : null,
            chargePaymentId: data.charge_payment_id || null

          trialLoaded = true;

          // reconcile once per session so a late success still converts.
          if(trialStatus.status === "trial_active" && trialStatus.trialEndsAtMs && Date.now() > trialStatus.trialEndsAtMs && !trialReconciled){
            trialReconciled = true;

      // Trial access is TIME-boxed, not status-boxed: a charge_pending user

      function trialAccess(){
        if(!trialStatus) return {active:false, status:null, endsAtMs:null, chargeAtMs:null};
        if(trialStatus.status === "trial_active" && trialStatus.trialEndsAtMs && Date.now() < trialStatus.trialEndsAtMs){
          return {active:true, status:"trial_active", endsAtMs: trialStatus.trialEndsAtMs, chargeAtMs: trialStatus.chargeAtMs};
        }
        return {active:false, status: trialStatus.status, endsAtMs: trialStatus.trialEndsAtMs, chargeAtMs: trialStatus.chargeAtMs};

      async function reconcileTrial(){
        if(!trialStatus || !trialStatus.id) return;
        try{
          const { data: { session } } = await supabaseClient.auth.getSession();
          if(!session) return;
          const res = await fetch(SUPABASE_URL + "/functions/v1/razorpay-webhook/trial/reconcile", {

            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + session.access_token, "apikey": SUPABASE_ANON_KEY},
            body: JSON.stringify({trial_subscription_id: trialStatus.id})
          });
          const out = await res.json().catch(() => ({}));
          if(res.ok && out && out.ok) await loadTrialStatus();
        }catch(e){ /* reconcile is best effort */ }

      async function startTrial(){
        const msgEl = $("paywallMsg");
        const showMsg = (t, kind) => { if(msgEl) msgEl.innerHTML = t ? '<div class="' + (kind === "err" ? "err-box" : "ok-box") + '" style="margin:0 0 12px">' + esc(t) + '</div>' : ""; };
        if(paywallBusy) return;
        if(!currentUser){ closePaywall(); toast("Sign in to start your ₹1 trial."); render(); return; }
        paywallBusy = true;
        const cta = $("paywallCta");
        if(cta){ cta.disabled = true; cta.textContent = "Starting trial…"; }
        try{
          const { data: { session } } = await supabaseClient.auth.getSession();
          const token = session && session.access_token;
          if(!token) throw new Error("no_session");
          const res = await fetch(SUPABASE_URL + "/functions/v1/razorpay-webhook/trial/create", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token, "apikey": SUPABASE_ANON_KEY},
            body: JSON.stringify({})
          });
          if(res.status === 404){
            showMsg("Trial checkout is being set up — the payment server is not live yet. Please try again later.", "err");
            return;
          }
          const out = await res.json().catch(() => ({}));
          if(!res.ok || !out || !out.ok){
            if(out && out.error === "already_subscribed") showMsg("You already have an active plan — no trial needed.", "err");
            else if(out && (out.error === "trial_already_used" || out.existing)) showMsg("You have already used your one trial.", "err");
            else if(out && out.error === "trial_not_configured") showMsg("Trial checkout is being set up — please try again later.", "err");
            else showMsg("Could not start the trial — check your connection and try again.", "err");
            return;
          }
          if(out.existing){ showMsg("You have already used your one trial.", "err"); return; }
          openTrialCheckout(out.subscription_id, out.key_id || paymentConfig.keyId);
        }catch(e){
          showMsg("Could not start the trial — check your connection and try again.", "err");
        }finally{
          paywallBusy = false;
          if(cta){ cta.disabled = false; cta.textContent = "Pay ₹1 and start"; }
        }

      // ---------- Free quota: 3 videos/day (soft for guests, enforced for signed-in) ----------
      // Guests have no identity: their cap is localStorage-only and a guest
      // clearing storage gets 3 more. Signed-in non-subscribers get the
      // enforced free_video_views counter (falls back to localStorage until
      // replica/schema.sql is applied).
      function freeQuotaKey(){ return istDateStr(new Date()); }
      function guestFreeLeft(){
        const used = LS.get("tt_guest_free_" + freeQuotaKey(), 0) || 0;
        return Math.max(0, 3 - used);
      }
      async function signedInFreeLeft(){
        if(!currentUser) return guestFreeLeft();
        try{
          const { data, error } = await supabaseClient.from("free_video_views").select("videos_watched").eq("user_id", currentUser.id).eq("view_date", freeQuotaKey()).maybeSingle();
          if(error) throw error;
          return Math.max(0, 3 - ((data && data.videos_watched) || 0));
        }catch(e){
          const used = LS.get("tt_free_" + freeQuotaKey(), 0) || 0;
          return Math.max(0, 3 - used);
        }
      }
      async function consumeFreeView(){
        if(!currentUser){ LS.set("tt_guest_free_" + freeQuotaKey(), (LS.get("tt_guest_free_" + freeQuotaKey(), 0) || 0) + 1); return; }
        try{
          const { data } = await supabaseClient.from("free_video_views").select("videos_watched").eq("user_id", currentUser.id).eq("view_date", freeQuotaKey()).maybeSingle();
          const used = (data && data.videos_watched) || 0;
          await supabaseClient.from("free_video_views").upsert({user_id: currentUser.id, view_date: freeQuotaKey(), videos_watched: Math.min(3, used + 1)}, {onConflict: "user_id,view_date"});
        }catch(e){
          LS.set("tt_free_" + freeQuotaKey(), (LS.get("tt_free_" + freeQuotaKey(), 0) || 0) + 1);
        }
      }

      // Progress, interactions and library live in localStorage AND (best

      // the Supabase writes fail silently until replica/schema.sql is applied.
      function progressMap(){ return LS.get("tt_web_progress", {}); }
      function saveProgress(courseId, lessonId, positionSec, completed){
        const map = progressMap();
        const key = courseId + "|" + lessonId;
        map[key] = {positionSec: Math.floor(positionSec || 0), completed: !!completed, updatedMs: Date.now()};
        LS.set("tt_web_progress", map);
        if(currentUser){
          supabaseClient.from("lesson_progress").upsert({user_id: currentUser.id, course_id: courseId, lesson_id: lessonId, position_sec: Math.floor(positionSec || 0), completed: !!completed}, {onConflict: "user_id,course_id,lesson_id"}).then(() => {}).catch(() => {});
        }
      }
      function interactionMap(){ return LS.get("tt_web_interactions", {}); }
      function toggleInteraction(courseId, lessonId, field){
        const map = interactionMap();
        const key = courseId + "|" + lessonId;
        const cur = map[key] || {liked: false, bookmarked: false};
        cur[field] = !cur[field];
        map[key] = cur;
        LS.set("tt_web_interactions", map);
        if(currentUser){
          supabaseClient.from("episode_interactions").upsert({user_id: currentUser.id, course_id: courseId, lesson_id: lessonId, liked: !!cur.liked, bookmarked: !!cur.bookmarked}, {onConflict: "user_id,lesson_id"}).then(() => {}).catch(() => {});

      function continueWatching(){
        const map = progressMap();
        const byCourse = {};
        Object.keys(map).forEach(k => {
          const p = map[k];
          if(!p || p.completed) return;
          const parts = k.split("|");
          const c = parts[0];
          if(!byCourse[c] || p.updatedMs > byCourse[c].updatedMs) byCourse[c] = {lessonId: parts[1], positionSec: p.positionSec, updatedMs: p.updatedMs};

        return courses.filter(c => byCourse[c.id]).map(c => ({course: c, progress: byCourse[c.id]}));

      // ---------- Razorpay Checkout (no payment links needed) ----------
      // The public Key ID comes from payment_config.key_id (admin panel).
      // The Key Secret is NEVER in this file — it lives only in the
      // razorpay-webhook Edge Function secret, which verifies payments.
      function openCheckout(planId){
        const plan = planById(planId);
        if(!plan) return false;
        if(!paymentConfig.enabled || !paymentConfig.keyId){
          plansNotice = "Payments aren't set up yet — the admin needs to add the Razorpay Key ID first.";
          render();
          return false;
        }
        if(typeof Razorpay === "undefined"){
          plansNotice = "Razorpay Checkout could not load — check your connection and try again.";
          render();
          return false;
        }
        // Full plan price — the spin wheel is REMOVED, so no discount exists.
        const amountPaise = plan.pricePaise;
        const options = {
          key: paymentConfig.keyId,
          amount: amountPaise,
          currency: "INR",
          name: "TechnoTrade Academy",
          description: plan.name + " plan",
          prefill: {name: (currentUser && currentUser.displayName) || "", email: (currentUser && currentUser.email) || ""},
          notes: {plan_id: plan.id, user_id: (currentUser && currentUser.id) || ""},
          theme: {color: "#0A1F44"},
          modal: {ondismiss: function(){}},
          handler: function(response){ onCheckoutSuccess(plan, amountPaise, response); }
        };
        try{
          const rzp = new Razorpay(options);
          rzp.open();
        }catch(e){
          plansNotice = "Could not open the payment checkout: " + authErrorText(e);
          render();
          return false;
        }
        return true;
      }
      // Asks the webhook function to verify the Checkout handler signature
      // server-side (HMAC-SHA256 of order_id|payment_id with the Key Secret).
      // Non-fatal: the payments row + checkMyPayment below stay the fallback,
      // so a missing/unreachable function never blocks activation.
      async function verifyCheckoutWithServer(response){
        try{
          const res = await fetch(SUPABASE_URL + "/functions/v1/razorpay-webhook/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY},
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id || "",
              razorpay_payment_id: response.razorpay_payment_id || "",
              razorpay_signature: response.razorpay_signature || ""
            })
          });
          const out = await res.json().catch(() => ({}));
          return !!(res.ok && out && out.ok);
        }catch(e){ return false; }
      }
      async function onCheckoutSuccess(plan, amountPaise, response){
        const payId = response && response.razorpay_payment_id;
        if(!payId){
          plansNotice = "Payment finished but no Payment ID came back. Contact support from Help & Support.";
          render();
          return;
        }
        const { error } = await supabaseClient.from("payments").insert({
          id: payId, user_id: (currentUser && currentUser.id) || null,
          plan_id: plan.id, amount: amountPaise, status: "captured",
          kind: "plan_purchase"
        });
        if(error){
          plansNotice = "Payment received (ID " + payId + ") but could not be saved. Contact support from Help & Support.";
          render();
          return;
        }
        plansNotice = "Payment received (ID " + payId + "). Activating your plan…";
        render();
        await verifyCheckoutWithServer(response);
        try{ await checkMyPayment(); }catch(e){}
        plansNotice = access().hasActiveSubscription
          ? "Payment confirmed — your " + plan.name + " plan is now active. Happy learning!"
          : "Payment received (ID " + payId + "). It will be confirmed shortly — if your plan is not active in a few minutes, contact support from Help & Support.";
        render();
      }

      // Mirrors android Repo.verifyPayment + claimPayment + createSubscriptionFromPayment.
      // A subscription is created ONLY when a Supabase payments record exists with
      // status "captured" for this user and plan. There is no client-side success path.
      async function createSubscriptionFromRecord(record){
        const plan = planById(record.planId);
        if(!plan) throw new Error("Unknown plan on this payment record.");
        const {now, exp} = subDatesFor(plan);

          user_id: record.userId, plan_id: record.planId, status: "active",
          expires_at: exp.toISOString()
        });
        if(error) throw error;
        subscription = {planId: record.planId, status: "active", expiresAt: {toDate: () => exp}};
        // No referral call here: the referral system was REMOVED ENTIRELY
        // (redirect 2026-11-16). Conversion/activation creates the

        render();
        store.addInbox("Subscription activated", "Your " + plan.name + " plan is active until " + fmtDate(exp) + ".");

      async function checkMyPayment(){
        const btn = $("checkPaymentBtn");
        if(btn) btn.disabled = true;
        verifyMsg("", "");
        try{
          const uid = currentUser.id;
          const { data, error } = await supabaseClient.from("payments").select("*").eq("user_id", uid).order("created_at", {ascending: false});
          if(error) throw error;
          // Trial-fee rows (the Rs.1) can NEVER activate a plan — they are
          // filtered out before any plan/amount check.
          const mine = (data || []).map(normalizePayment).filter(p => p.status === "captured" && p.kind !== "trial_fee");
          mine.sort((a, b) => {
            const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
            const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
            return tb - ta;
          });
          if(!mine.length){
            verifyMsg("No confirmed payment found for your account yet. If you just paid, wait a minute and try again — or use your Payment ID below.", "warn");
            return;
          }
          const rec = mine[0];
          const plan = planById(rec.planId);
          if(!plan || rec.amountPaise !== plan.pricePaise){
            verifyMsg("Found a payment, but its plan or amount does not match. Contact support from Help & Support.", "err");
            return;
          }
          await createSubscriptionFromRecord(rec);
          verifyMsg("Payment confirmed — your " + plan.name + " plan is now active. Happy learning!", "ok");
        }catch(e){
          verifyMsg("Could not check right now: " + authErrorText(e), "err");
        }finally{
          if(btn) btn.disabled = false;
        }
      }
      async function verifyPaymentId(payId){
        const btn = $("verifyIdBtn");
        if(btn) btn.disabled = true;
        verifyMsg("", "");
        try{
          const uid = currentUser.id;
          const { data: row, error } = await supabaseClient.from("payments").select("*").eq("id", payId).maybeSingle();
          if(error) throw error;
          if(!row){
            verifyMsg("No payment found with that ID yet. Check the ID (it starts with pay_…) or wait a minute and try again.", "warn");
            return;
          }
          const rec = normalizePayment(row);
          const plan = planById(rec.planId);
          if(!plan){
            verifyMsg("This payment is not for a Monthly or Yearly plan. Contact support from Help & Support.", "err");
            return;
          }
          if(rec.kind === "trial_fee"){
            verifyMsg("This payment is the ₹1 trial fee — it does not activate a plan. Your trial is activated by the trial flow, not by this check.", "err");
            return;
          }
          if(rec.status !== "captured"){
            verifyMsg("This payment is not confirmed yet (status: " + (rec.status || "unknown") + "). If you just paid, wait a minute and try again.", "warn");
            return;
          }
          if(rec.amountPaise !== plan.pricePaise){
            verifyMsg("This payment's amount does not match the " + plan.name + " plan. Contact support from Help & Support.", "err");
            return;
          }
          if(rec.userId && rec.userId !== uid){
            verifyMsg("This payment belongs to a different account. Sign in with the account you paid from.", "err");
            return;
          }
          if(!rec.userId){
            // Claim: attach this unassigned payment to the caller's own account.
            // Needs an UPDATE policy for unclaimed rows (user_id IS NULL) — see
            // the payments-claim policy in the Supabase SQL migration file.
            const { error: claimErr } = await supabaseClient.from("payments").update({user_id: uid}).eq("id", payId);
            if(claimErr) throw claimErr;
            rec.userId = uid;
          }
          await createSubscriptionFromRecord(rec);
          verifyMsg("Payment confirmed — your " + plan.name + " plan is now active. Happy learning!", "ok");
        }catch(e){
          verifyMsg("Verification failed: " + authErrorText(e), "err");
        }finally{
          if(btn) btn.disabled = false;
        }
      }

        const thread = $("supportThread");
        if(thread) thread.scrollTop = thread.scrollHeight;
        const send = () => { sendSupportMessage().catch(() => {}); };
        const btn = $("supportSendBtn");
        if(btn) btn.addEventListener("click", send);
        const input = $("supportInput");
        if(input) input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
      }
      async function sendSupportMessage(){
        const input = $("supportInput");
        const text = input ? input.value.trim() : "";
        if(!text || !currentUser) return;
        const btn = $("supportSendBtn");
        if(btn) btn.disabled = true;
        try{
          const { error } = await supabaseClient.from("support_messages").insert({
            user_id: currentUser.id, sender: "user", message: text
          });
          if(error) throw error;
          if(input) input.value = "";
          await loadSupportMessages();
        }catch(e){
          toast("Could not send — check your connection and try again.");
        }finally{
          if(btn) btn.disabled = false;
        }
      }

      // Fresh sign-in always lands on Home: a tab other than Home left in the
      // URL (e.g. #/courses from the signed-out screen) is not kept. Deep links
      // to a course or lesson are preserved, as are returning sessions.
      function landOnHomeAfterSignIn(event){
        if(event !== "SIGNED_IN" || !currentUser) return;
        const r = currentRoute();
        if(isTabRoute(r.name) && r.name !== "home") location.hash = "#/home";
      }

      // ---------- boot ----------
      // Normalize the Supabase user into the shape the UI expects
      // ({uid, id, email, displayName}) so the rest of the code is unchanged.
      function normalizeUser(user){
        const meta = user.user_metadata || {};
        const displayName = meta.display_name || meta.full_name || meta.name || "";
        return {uid: user.id, id: user.id, email: user.email || "", displayName: displayName};
      }
      let lastAuthUid = undefined;
      supabaseClient.auth.onAuthStateChange((event, session) => {
        const user = session ? session.user : null;
        const uid = user ? user.id : null;
        if(event === "TOKEN_REFRESHED" && uid === lastAuthUid) return; // silent refresh: nothing to redo
        // A different account must never see the previous account's support thread.
        if(uid !== lastAuthUid) supportMessages = null;
        // Same for trial state: a different account must never see the
        // previous account's trial. (Referral + wallet are REMOVED —
        // redirect 2026-11-16 — no code for them remains.)
        if(uid !== lastAuthUid){ trialStatus = null; trialLoaded = false; trialReconciled = false; freePreviewLesson = ""; }
        lastAuthUid = uid;
        currentUser = user ? normalizeUser(user) : null;
        isAdmin = false;
        if(currentUser){
          ensureUserDoc().catch(() => {});
          loadAdminAccess().catch(() => {});
          loadTrialStatus().catch(() => {});
        }
        landOnHomeAfterSignIn(event);
        startListeners();
        render();
      });
      window.addEventListener("hashchange", () => { paymentHistory = null; render(); window.scrollTo(0,0); });
    </script>
  </body>
</html>
